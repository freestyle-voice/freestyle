# Changelog Preview workflow
# Shows how PRs will appear in the changelog
# https://craft.sentry.dev/

name: Changelog Preview
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  changelog-preview:
    name: Preview Changelog
    # Skip for external fork PRs — checkout@v6 refuses to check out fork code
    # from pull_request_target (pwn request protection). Safe to skip since this
    # is just a changelog preview comment for maintainers.
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: getsentry/craft/.github/workflows/changelog-preview.yml@v2
    secrets: inherit
